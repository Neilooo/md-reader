[package]
name = "md-reader"
version = "0.3.13"
description = "A lightweight, fast, WYSIWYG Markdown desktop reader"
authors = ["Neilooo"]
license = "MIT"
homepage = "https://github.com/Neilooo/md-reader"
repository = "https://github.com/Neilooo/md-reader"
edition = "2021"
rust-version = "1.77"

[lib]
name = "md_reader_lib"
# 只能是 rlib：加 staticlib/cdylib 会让 #[tauri::command] 宏展开两次直接
# 构建失败（E0255 宏重导入冲突），这是实测踩过的坑，别改。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 必须开：tauri.conf.json 启用了 assetProtocol，两边不匹配
# 会报 "allowlist does not match" 构建失败。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-system-fonts = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "6"
notify-debouncer-mini = "0.4"

# WebView2 运行时检测 / 缺失提示（见 lib.rs prepare_windows_webview）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# panic = abort：任何 panic 都会立即退出进程（无 unwind）。所以后端代码里
# 任何可能 panic 的点（unwrap / state() / 锁中毒）都要当成崩溃对待——
# #33 的 macOS 双击闪退就是这么来的。
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
