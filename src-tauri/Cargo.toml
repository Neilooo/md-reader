[package]
name = "md-reader"
version = "0.3.4"
description = "A lightweight, fast, WYSIWYG Markdown desktop reader"
authors = ["Neilooo"]
license = "MIT"
homepage = "https://github.com/Neilooo/md-reader"
repository = "https://github.com/Neilooo/md-reader"
edition = "2021"

[lib]
name = "md_reader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-system-fonts = "2.0.2"
window-vibrancy = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
